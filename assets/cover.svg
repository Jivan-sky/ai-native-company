    <rect x="56" y="48" width="568" height="552" rx="34" fill="url(#innerGlow)"/>
    <rect x="56.7" y="48.7" width="566.6" height="550.6" rx="33.3" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
    <rect x="60.5" y="52.5" width="559" height="543" rx="29.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.22"/>

    <rect x="100" y="95" width="86" height="34" rx="17" fill="#06283D" fill-opacity="0.16" filter="url(#shadowTight)"/>
