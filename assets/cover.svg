    <text x="202" y="115" font-size="15" font-weight="600" letter-spacing="3.2" fill="#1D4E6B">一份真相源，三个消费面</text>

    <text x="100" y="258" font-size="74" font-weight="800" letter-spacing="-1" fill="url(#wordmark)">AI-NATIVE</text>
    <text x="100" y="336" font-size="74" font-weight="800" letter-spacing="-1" fill="url(#wordmark)">COMPANY</text>
    <text x="100" y="386" font-size="21" fill="#2E5C78">把组织协调能力从人的职位上解绑，挂到系统上</text>

    <rect x="100" y="416" width="76" height="3" rx="1.5" fill="url(#ruleGrad)"/>

    <text x="100" y="452" font-size="13" font-weight="700" letter-spacing="2.5" fill="#04263F">硬指标</text>
    <text x="100" y="482" font-size="17" fill="#2E5C78">新人或 Agent 不靠问人，拿到全部上下文、权限、工具，</text>
    <text x="100" y="510" font-size="17" font-weight="600" fill="#04263F">把活做完，并且有人能验证。</text>

