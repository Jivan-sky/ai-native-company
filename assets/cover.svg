<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="AI-Native Company：把组织协调能力从人的职位上解绑，挂到系统上">
  <title>ai-native-company (ANC)</title>
  <desc>封面：一份真相源（SPEC.md），三个消费面（人读 / Agent 读 / 机器跑）。</desc>
  <defs>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.5" stop-color="#04141C" stop-opacity="0"/>
      <stop offset="1" stop-color="#04141C" stop-opacity="0.32"/>
    </radialGradient>
    <linearGradient id="wordmark" gradientUnits="userSpaceOnUse" x1="95" y1="200" x2="520" y2="340">
      <stop offset="0" stop-color="#04263F"/><stop offset="0.55" stop-color="#0A5480"/><stop offset="1" stop-color="#0E82AC"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E82AC"/><stop offset="1" stop-color="#14B8A0"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="safeLift" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glass" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="30"/><feColorMatrix type="saturate" values="1.50"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.05" intercept="0.30"/>
        <feFuncG type="linear" slope="1.05" intercept="0.30"/>
        <feFuncB type="linear" slope="1.05" intercept="0.32"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadowWide" x="-40%" y="-40%" width="180%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadowTight" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <g id="scene">
      <rect width="1280" height="640" fill="#08202B"/>
      <image href="background.jpg" x="0" y="0" width="1280" height="640" preserveAspectRatio="xMidYMid slice"/>
      <rect width="1280" height="640" fill="url(#vignette)"/>
    </g>
    <g id="sceneGlass" filter="url(#glass)"><use href="#scene"/></g>
    <clipPath id="clipSheet"><rect x="56" y="48" width="568" height="552" rx="34"/></clipPath>
    <clipPath id="clipSpec"><rect x="676" y="278" width="176" height="92" rx="20"/></clipPath>
    <clipPath id="clip1"><rect x="1000" y="131" width="200" height="66" rx="16"/></clipPath>
    <clipPath id="clip2"><rect x="1000" y="291" width="200" height="66" rx="16"/></clipPath>
    <clipPath id="clip3"><rect x="1000" y="451" width="200" height="66" rx="16"/></clipPath>
    <clipPath id="clipCap"><rect x="664" y="556" width="440" height="34" rx="17"/></clipPath>
  </defs>

  <use href="#scene"/>

