<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ANC 看板</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!--
  这是看板的**外壳**：样式与骨架手写在这里，界面内容由 app.js（TS 构建产物）填。
  app.js 不是运行时依赖：它是构建期打出来的静态文件，随 anc 二进制一起嵌进去。

  版式：左边一条固定的导航（哪些页、各自接没接数据源），右边是当前页。
  导航用 <a href="#/id"> —— 浏览器原生 hash 路由，不写额外的路由器代码。
-->
<style>
  :root {
    --ink: #0b1f33;
    --ink-2: #3d5f80;
    --ink-3: #6b8aa6;
    --line: rgba(255, 255, 255, 0.62);
    --line-2: rgba(11, 31, 51, 0.08);
    --sea: #0a84ff;
    --glass: rgba(255, 255, 255, 0.56);
    --glass-2: rgba(255, 255, 255, 0.36);
    --shadow: 0 12px 34px rgba(12, 40, 70, 0.10), 0 2px 6px rgba(12, 40, 70, 0.05);
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    font: 15px/1.62 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1100px 620px at 12% -8%, #d9f0ff 0%, rgba(217, 240, 255, 0) 62%),
      radial-gradient(900px 560px at 92% 4%, #d6f6f0 0%, rgba(214, 246, 240, 0) 60%),
      radial-gradient(760px 620px at 68% 106%, #e6ecff 0%, rgba(230, 236, 255, 0) 64%),
      linear-gradient(168deg, #f6fbff 0%, #eef6fb 44%, #f4f9ff 100%);
    background-attachment: fixed;
  }
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(22px) saturate(165%);
    backdrop-filter: blur(22px) saturate(165%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  main { display: block; }
  .shell {
    display: grid;
    grid-template-columns: 216px minmax(0, 1fr);
    gap: 20px;
    align-items: start;
    max-width: 1320px;
    margin: 0 auto;
    padding: 26px 22px 64px;
  }
  .col { min-width: 0; }

  /* 左侧导航 */
  .rail { position: sticky; top: 26px; padding: 15px 12px 13px; }
  .brandbox { padding: 2px 9px 12px; border-bottom: 1px solid var(--line-2); }
  .brandbox .mark { font-size: 11.5px; font-weight: 700; letter-spacing: 1.7px; color: var(--sea); }
  .brandbox .co { margin-top: 7px; font-size: 15px; font-weight: 640; line-height: 1.34; }
  .brandbox .sub { margin-top: 3px; font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
  .tabs { margin-top: 11px; display: flex; flex-direction: column; gap: 2px; }
  .tab {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 11px; border-radius: 12px; text-decoration: none;
    color: var(--ink-2); font-size: 13.5px; border: 1px solid transparent;
  }
  .tab:hover { background: rgba(255, 255, 255, 0.5); text-decoration: none; }
  .tab.active {
    background: rgba(255, 255, 255, 0.82); color: var(--ink); font-weight: 620;
    border-color: var(--line); box-shadow: 0 2px 10px rgba(12, 40, 70, 0.06);
  }
  .res { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; white-space: nowrap; flex: none; }
  .res.on { color: #12633a; background: rgba(29, 185, 84, 0.14); }
  .res.off { color: var(--ink-3); background: rgba(11, 31, 51, 0.06); }

  /* 页头 */
  header.top { padding: 17px 24px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  header.top .q h1 { margin: 0; font-size: 20px; font-weight: 660; letter-spacing: -0.2px; }
  header.top .q .ask { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); }
  .spacer { flex: 1 1 120px; }
  .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px; font-size: 12.5px; color: var(--ink-2);
    background: var(--glass-2); border: 1px solid var(--line); white-space: nowrap;
  }
  .chip.mono, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  button.refresh {
    font: inherit; font-size: 13px; color: var(--ink); cursor: pointer;
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--glass-2);
  }
  button.refresh:hover { background: rgba(255, 255, 255, 0.72); }
  button.refresh:disabled { opacity: 0.5; cursor: default; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .dot.ok { background: #1db954; }
  .dot.warn { background: #e8a33d; }
  .dot.bad { background: #e0483d; }
  /* 灰档：status 是个认不出的词 —— 原样显示，不硬塞进三档里 */
  .dot.gray { background: #9aa7b4; }

  section { margin-top: 20px; padding: 20px 24px 24px; }
  section > h2 {
    margin: 0 0 2px; font-size: 15px; font-weight: 620; letter-spacing: 0.2px;
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  section > h2 .hint { font-weight: 400; font-size: 12.5px; color: var(--ink-3); }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(266px, 1fr)); margin-top: 16px; }
  .grid.stats { grid-template-columns: repeat(auto-fill, minmax(142px, 1fr)); }
  .card {
    padding: 15px 16px; border-radius: 16px;
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid var(--line-2);
    box-shadow: 0 2px 10px rgba(12, 40, 70, 0.04);
  }
  .card h3 { margin: 0 0 8px; font-size: 15px; font-weight: 620; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; }
  .card dt { color: var(--ink-3); white-space: nowrap; }
  .card dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
  .card.stat .n { font-size: 27px; font-weight: 680; letter-spacing: -0.6px; line-height: 1.18; }
  .card.stat .k { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .card.stat .sub { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
  .cannot { color: #8a3b34; }
  /* 状态点 + 文字：.dot 是固定宽高，得靠 inline-flex 才撑得开 */
  .st { display: inline-flex; align-items: center; gap: 8px; }
  /* 时间线页：一个 case 一个原生 <details> 折叠（不写 JS），summary 里点 + 字一行排 */
  details { margin-top: 12px; }
  details > summary { cursor: pointer; padding: 7px 2px; }
  details > summary .st { flex-wrap: wrap; }
  details > summary:hover { color: var(--sea); }

  .tw { overflow-x: auto; margin-top: 16px; }
  .tw > table { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
  td { overflow-wrap: anywhere; }
  th { color: var(--ink-3); font-weight: 520; font-size: 12.5px; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  a { color: var(--sea); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .banner { margin-top: 20px; padding: 16px 20px; border-radius: 18px; font-size: 13.5px; }
  .banner h3 { margin: 0 0 8px; font-size: 14px; font-weight: 620; }
  .banner ul { margin: 0; padding-left: 20px; }
  .banner li { margin: 3px 0; }
  .banner.bad { background: rgba(255, 236, 234, 0.74); border: 1px solid rgba(224, 72, 61, 0.28); color: #7d1f18; }
  .banner.warn { background: rgba(255, 247, 231, 0.76); border: 1px solid rgba(232, 163, 61, 0.32); color: #7a5312; }
  .empty { color: var(--ink-3); font-size: 13px; margin: 14px 0 0; }
  .pad { padding: 20px 24px; }
  footer { margin-top: 26px; color: var(--ink-3); font-size: 12.5px; line-height: 1.95; }
  footer strong { color: var(--ink-2); font-weight: 560; }
  .loading { color: var(--ink-3); }

  @media (max-width: 900px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .rail { position: static; }
    .brandbox { border-bottom: none; padding-bottom: 0; }
    .tabs { flex-direction: row; overflow-x: auto; padding-bottom: 3px; }
    .tab { flex: none; gap: 6px; }
  }
</style>
</head>
<body>
<main id="app"><div class="glass pad loading">正在读取真相源…</div></main>
<noscript><main><div class="glass" style="padding:20px 24px">看板需要 JavaScript 才能渲染。</div></main></noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
